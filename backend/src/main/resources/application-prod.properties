spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

jwt.secret=${JWT_SECRET}
jwt.access-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}
jwt.refresh-expiry-ms=${JWT_REFRESH_EXPIRY_MS:2592000000}

firebase.enabled=${FIREBASE_ENABLED:false}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}
firebase.database-url=${FIREBASE_DATABASE_URL:}

welfare.support-alert-email=${SUPPORT_ALERT_EMAIL:}

app.public-url=${APP_PUBLIC_URL:https://nestbridge-production.up.railway.app}
app.mobile-scheme=${APP_MOBILE_SCHEME:nestbridge}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

email.sendgrid-api-key=${SENDGRID_API_KEY:}
email.from-address=${EMAIL_FROM:noreply@nestbridge.app}
email.from-name=${EMAIL_FROM_NAME:NestBridge}
# EMAIL_FROM must be a Verified Sender (or on an authenticated domain) in SendGrid.
email.verification-enabled=${EMAIL_VERIFICATION_ENABLED:true}

paystack.enabled=${PAYSTACK_ENABLED:false}
paystack.secret-key=${PAYSTACK_SECRET_KEY:}

aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_S3_REGION:eu-west-1}
aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

smile.enabled=${SMILE_ENABLED:false}
smile.partner-id=${SMILE_PARTNER_ID:}
smile.api-key=${SMILE_API_KEY:}
smile.callback-url=${SMILE_CALLBACK_URL:}
smile.environment=${SMILE_ENVIRONMENT:sandbox}

# Comma-separated emails auto-granted is_staff=true at registration (restart after env change — no code redeploy).
admin.email-allowlist=${ADMIN_EMAIL_ALLOWLIST:}

server.forward-headers-strategy=framework
