spring.datasource.url=jdbc:postgresql://localhost:5432/nestbridge
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=nestbridge-dev-secret-key-min-256-bits-for-hs256-signing!!
jwt.access-expiry-ms=900000
jwt.refresh-expiry-ms=2592000000

firebase.enabled=false
firebase.credentials.path=
firebase.database-url=

# Set firebase.enabled=true and credentials path after creating a Firebase project.
# See backend/README.md and .env.example for setup steps.

app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

email.sendgrid-api-key=${SENDGRID_API_KEY:}
email.from-address=${EMAIL_FROM:noreply@nestbridge.app}
email.from-name=${EMAIL_FROM_NAME:NestBridge}
email.verification-enabled=${EMAIL_VERIFICATION_ENABLED:true}

paystack.enabled=${PAYSTACK_ENABLED:false}
paystack.secret-key=${PAYSTACK_SECRET_KEY:}

smile.enabled=${SMILE_ENABLED:false}
smile.partner-id=${SMILE_PARTNER_ID:}
smile.api-key=${SMILE_API_KEY:}
smile.callback-url=${SMILE_CALLBACK_URL:}
smile.environment=${SMILE_ENVIRONMENT:sandbox}

aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_S3_REGION:eu-west-1}
aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
