services:
  postgres:
    image: postgres:15-alpine
    container_name: nestbridge-postgres
    environment:
      POSTGRES_DB: nestbridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nestbridge_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nestbridge-redis
    ports:
      - "6379:6379"

volumes:
  nestbridge_pg_data:
